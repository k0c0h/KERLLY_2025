<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTENEDORES</title>
    <link rel="stylesheet" href="public/bootstrap-5.3.5-dist/css/bootstrap.min.css">

</head>

<body>
    <h1>CALCULADORA</h1>

    <div class="container-fluid">
        <div class="row row-cols-4">
            <div class="col-12 text-center bg-dark">
                <form class="row g-3">
                    <div class="col-12 ">
                      <label for="txt_caja_resultado" class="form-label"></label>
                      <input type="number" class="form-control" id="txt_caja_resultado">
                    </div>
                </form>
            </div>
        </div>
       
       <div class="row col">
            <div class="col-12 text-center bg-dark">2</div>
       </div>

        <div class="row row-cols-4">
            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" data-valor="3" onclick="capturar(this)" type="button">3</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" data-valor="4" onclick="capturar(this)" type="button">4</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary"  data-valor="5" onclick="capturar(this)" type="button">5</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" data-valor="/" onclick="capturar(this)" type="button">/</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary"  data-valor="0" onclick="capturar(this)" type="button">0</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" data-valor="1" onclick="capturar(this)" type="button">1</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" data-valor="2" onclick="capturar(this)" type="button">2</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" data-valor="*" onclick="capturar(this)" type="button">*</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary " data-valor="." onclick="capturar(this)" type="button">.</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" data-valor="-" onclick="capturar(this)" type="button">-</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-info text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" data-valor="+" onclick="capturar(this)" type="button">+</button>
                </div>
            </div>

            <div class="col-sm-6 col-md-2 bg-warning text-white">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-danger" data-valor="=" onclick="capturar(this)" type="button">=</button>
                </div>
            </div>
        </div>
    </div>

    <script src="public/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
    <script src="public/dist/js/calculadora.js"></script>
</body>

</html>
