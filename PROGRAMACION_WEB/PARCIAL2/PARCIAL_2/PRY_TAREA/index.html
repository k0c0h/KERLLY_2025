<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEBER 1 - POSICIONAMIENTO</title>
  <style>
    /* Fondo con imagen que ocupa toda la pantalla */
    .fondo {
      background-image: url('https://img.freepik.com/vector-gratis/plantilla-patron-color-pastel-dibujado-mano_23-2149363679.jpg?ga=GA1.1.1778699843.1749350270&semt=ais_hybrid&w=740');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      padding-top: 50px;
      /* Espacio superior para que el contenido no quede pegado arriba */
    }

    /* Estilo del logo con bordes redondeados y un efecto al pasar el mouse */
    .logo {
      width: 250px;
      border-radius: 30px;
      margin-bottom: 30px;
      padding: 10px;
      transition: transform 0.3s;
      /* Animación suave al hacer hover */
    }

    .logo:hover {
      transform: scale(1.05);
      /* Aumenta un poco el tamaño al pasar el cursor */
    }

    /* Caja de búsqueda con sombra */
    .buscar {
      position: static;
      border-radius: 25px;
      padding: 10px 10px;
      width: 400px;
      border: none;
      box-shadow: 0 1px 3px rgb(116, 116, 116);
      font-size: 16px;
      margin-bottom: 20px;
    }

    /* Contenedor que coloca los íconos en fila con separación */
    .iconos-apps {
      display: flex;
      gap: 15px;
      margin-bottom: 50px;
    }

    /* Estilo individual para cada ícono de app */
    .icono {
      width: 48px;
      height: 48px;
      border-radius: 50px;
      background-color: rgba(126, 4, 220, 0);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      text-align: center;
      line-height: 48px;
      font-size: 20px;
      color: blueviolet;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    /* Cambia el color de fondo al pasar el mouse */
    .icono:hover {
      background-color: rgba(123, 9, 172, 0.667);
    }

    /* Botón para personalizar la página, fijado en la parte inferior derecha */
    .personalizar_pagina {
      position: fixed;
      bottom: 15px;
      right: 10px;
      background-color: rgba(146, 11, 199, 0.29);
      border-radius: 25px;
      border: none;
      color: rgb(0, 0, 0);
      padding: 6px 10px;
      cursor: pointer;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.47);
      font-size: small;
      transition: background-color 0.3s;
    }

    /* Contenedor flotante para el perfil de usuario */
    .usuario-perfil {
      position: fixed;
      bottom: 20px;
      left: 12px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s;
      z-index: 1000;
    }

    .usuario-perfil img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .usuario-perfil:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body class="fondo">
  <!-- Imagen del logo dentro de una figura -->
  <figure>
    <img class="logo" src="public/img/logo.jpeg" alt="Logo" />
  </figure>

  <!-- Avatar de usuario estilo Gmail -->
  <div class="usuario-perfil" title="Tu cuenta">
    <img src="https://lh3.googleusercontent.com/a/ACg8ocK6qh5m3ycW-57t8J3rP2qd-j9u-b62IlUYrju2-3TameVVXZ5V=s432-c-no" alt="Usuario" />
  </div>

  <!-- Campo de búsqueda con ícono -->
  <input class="buscar" type="search" placeholder="🔍︎ Buscar..." />

  <!-- Sección de íconos de apps tipo Google -->
  <div class="iconos-apps">
    <div class="icono" title="Drive">📁</div>
    <div class="icono" title="YouTube">▶️</div>
    <div class="icono" title="Ajustes">⚙️</div>
    <div class="icono" title="Gmail">📧</div>
  </div>

  <!-- Botón para editar la apariencia de la página -->
  <button class="personalizar_pagina">✎ Personalizar Página</button>
</body>

</html>
