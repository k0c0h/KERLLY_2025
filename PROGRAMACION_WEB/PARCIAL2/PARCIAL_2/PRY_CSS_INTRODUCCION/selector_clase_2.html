<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECTOR EN CLASE</title>
    <style>
        .importante {
            color: seagreen;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bolder;
            font-size: 30px;
        }

        .button {
            background-color: lightgreen;
            color: black;
            font-weight: bold;
            font-size: 20px;
        }

        .input {
            font-size: 20px;
            font-weight: bold;
            color: black;
            background-color: lightblue;
        }

        .destacado {
            font-weight: bold;
            font-size: 25px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: rgb(0, 255, 140);
        }

        .fecha {
            font-size: 20px;
            font-weight: bold;
            color: black;
            background-color: lightseagreen;
        }

        .titulo {
            font-size: 20px;
            font-weight: bold;
            color: black;
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <label class="importante">GÉNERO</label>
    <br>
    <input type="checkbox" name="genero[]" id="mujer">
    <label  for="mujer">Mujer</label>
    <br>
    <input type="checkbox" name="genero[]" id="hombre" disabled>
    <label for="hombre">Hombre</label>
    <br>
    <input type="checkbox" name="genero[]" id="otro" disabled>
    <label for="otro">Otro</label>

    <br><br>
    <button class="button">ENVIAR</button>

    <br><br>
    <label for="name">NOMBRE</label>
    <input class="input" type="text">

    <br><br>
    <label class="destacado" for="email">EMAIL</label>

    <br><br>
    <input class="fecha" type="date" name="hora" id="hora">

    <br><br>
    <label class="button" for="universidad">EN QUE UNIVERSIDAD ESTUDIA</label>
    <select class="titulo" name="" id="">
        <option value="">ESPE</option>
        <option value="">UCE</option>
        <option value="">EPN</option>
    </select>

</body>

</html>
