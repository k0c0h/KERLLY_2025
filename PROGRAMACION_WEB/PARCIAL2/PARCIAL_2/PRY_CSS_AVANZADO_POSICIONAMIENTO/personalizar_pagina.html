<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOTON PARA PERSOLNALIZAR PÁGINA</title>
    <style>
        body{
            background-color: rgba(213, 135, 250, 0.372);
        }

        .personalizar_pagina{
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: lightpink;
            border-radius: 25px;
            border: none;
            color: blueviolet;
            padding: 10px 10px;
            cursor:pointer;
            /* top, bottom, left, right */
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.702);
            font-size: small;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <button class="personalizar_pagina">✏️ Personalizar Página</button>
    
</body>
</html>
