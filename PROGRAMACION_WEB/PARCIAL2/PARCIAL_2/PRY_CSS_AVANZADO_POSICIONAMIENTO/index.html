<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS POSICIONAMIENTO</title>
    <link rel="stylesheet" href="public/css/">
    <style>
        div{
            background-color: lightpink;
        }
        .caja_saludo_estatica{/* en static no sirven las posiciones left, right,etc */
            position: static;
        }

        .caja_saludo_relativa{
            position: relative;
            top:50px;
            left: 30px;
            right: 50px;
            bottom: 35px;
        }

        .caja_saludo_absoluto{
            position: absolute;
            right: 10px;
            top: 70px;
        }

        .caja_saludo_fixed{
            position: fixed;
            top: 2px;
            right: 2px;
        }

        .caja_saludo_Sticky{
            position: sticky;
            top: 0px;
            left: 20px;
            background-color: aquamarine;
        }
    </style>
</head>
<body>

    <div class="caja_saludo_estatica">
        <h1>HELLO WORLD!</h1>
    </div>
    
    <div class="caja_saludo_Sticky">
        <h1>HOLA ESTOY EN CAJA STICKY</h1>
    </div> 

    <div class="caja_saludo_relativa">
        <h1>HELLO WORLD!</h1>
        <p>ESTA ES LA POSICION RELATIVA</p>
    </div>

    
    <div class="caja_saludo_absoluto">
        <p>ESTOY EN CLASES DE PROGRAMACIÓN</p>
        <p>ESTA ES A POSICION ABSOLUTA</p>
    </div>

    <!--cntrl+shift+L -> cambiar las palabras iguales  -->

    <div class="caja_saludo_fixed">
        <h1>ESTA ES LA CAJA FIXED</h1>
        <p>no se mueve cuando usamos el scroll</p>
    </div>

    
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
