<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAT BOT</title>
    <style>
        .chatbot {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background-color: rgba(150, 24, 204, 0.187);
            border-radius: 10px;
            box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.297);
            padding-top: 5px;
            padding-left: 10px;
            padding-right: 18px;
            padding-bottom: 30px;

        }

        .enviar {
            position: relative;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 10px;
            bottom: 10px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.702);
            top: 17px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            left: 10px;
            cursor: pointer;
        }

        .texto {
            position: relative;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif, Courier, monospace;
            left: 10px;
        }

        .textarea {
            position: relative;
            top: 10px;
            left: 8px;
            width: 250px;
            height: 50px;
            padding: 5px;
            border: 1px solid silver;
            border-radius: 5px;
            box-sizing: border-box;
            resize: none;            
            cursor: pointer;
        }
        .titulo{
            color: rgb(84, 16, 148);
            position: relative;
        }
    </style>
</head>

<body>
    <div class="chatbot">
        <h3 class="titulo">💬Hola, en que te puedo ayudar? </h3>
        <form action="">
            <label class="texto" for="pregunta">Ingrese su solicitud</label>
            <br>
            <textarea class="textarea" name="pregunta" id="pregunta" placeholder="Ej. ¿Cuál es tu horario?"></textarea>
            <br>
            <button class="enviar">Enviar</button>
        </form>
    </div>

</body>

</html>
