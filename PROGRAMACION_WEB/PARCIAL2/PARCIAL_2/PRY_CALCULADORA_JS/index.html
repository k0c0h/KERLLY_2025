<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora JS</title>
    <link rel="stylesheet" href="public/lib/bootstrap-5.3.5-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="public/css/calculadora.css">
</head>

<body>
    <div class="container mt-5 ">
        <h1 class="text-center mb-4 text-info">CALCULADORA BASICA</h1>
        <div class="card p-5 mx-auto">
            <input type="number" class="form-control mb-5" disabled value="0" id="txt_pantalla">

            <div class="row g-2">
                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(9)">9</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(8)">8</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(7)">7</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-danger" onclick="seleccionarOperacion('+')">+</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(6)">6</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(5)">5</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(4)">4</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-danger" onclick="seleccionarOperacion('-')">-</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(3)">3</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(2)">2</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(1)">1</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-danger" onclick="seleccionarOperacion('*')">*</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-outline-info" onclick="limpiar()">C</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-success" onclick="agregarNumero(0)">0</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-warning" onclick="calcular()">=</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-outline-danger" onclick="seleccionarOperacion('/')">/</button>
                </div>
            </div>
        </div>
    </div>
    <script src="public/js/calculadora.js"></script>
    <script src="public/lib/bootstrap-5.3.5-dist/js/bootstrap.min.js"></script>
</body>

</html>
