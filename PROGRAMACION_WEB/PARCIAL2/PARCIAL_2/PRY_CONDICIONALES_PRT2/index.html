<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDICIONALES PRT2</title>
    <link rel="stylesheet" href="public/lib/bootstrap-5.3.5-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="public/css/style.css">
</head>

<body class="body">
    <div class="container my-5">
        <h1 class="text-center">ACCESO AL USUARIO ADMIN - SI ESTA ACTIVO</h1>
        <div class="card border border-2 border-primary p-2">
            <label for="">Seleccione un estado: </label>
            <div class="border boder-1 boder-info mx-2 py-2">
                <label for="">Activo </label>
                <input onchange="seleccionarEstado(this)" class=" check form-check-input" type="radio"
                    name="radio_activo" id="radio_activo" value="1">
                <br>
                <label for="">Inactivo </label>
                <input onchange="seleccionarEstado(this)" class=" check form-check-input" type="radio"
                    name="radio_activo" id="radio_inactivo" value="0">
            </div>

            <label for="">Seleccione Usuario</label>
            <select onchange="seleccionarUsuario(this)" class=" select form-select form-select-lg" name=""
                id="select_usuario">
                <option value="" disabled selected>Seleccione una opcion: </option>
                <option value="cliente">Cliente</option>
                <option value="admin">Administrador</option>
                <option value="docente">Docente</option>
                <option value="estudiante">Estudiante</option>
                <option value="secretaria">Secretaria</option>
            </select>

            <label for="pregunta_secreta" class="mt-3">¿Cuál es el color favorito de el dueño?</label>
            <input type="text" id="pregunta_secreta" class="form-control" placeholder="Ejemplo: azul">

            <h4 class=" h4 pt-2 fw-bold" id="txt_resultado"></h4>

        </div>

    </div>
    <script src="public/js/acceso_usuario.js"></script>
    <script src="public/lib/bootstrap-5.3.5-dist/js/bootstrap.min.js"></script>
</body>

</html>
