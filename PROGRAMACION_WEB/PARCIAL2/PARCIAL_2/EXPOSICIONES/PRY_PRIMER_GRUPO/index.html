<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARIABLES CSS</title>
    <style>
        :root {
            --color-bg: #ffffff;
            --color-text: #000000;
            --color-primary: #1db954;
            --color-card: #f1f1f1;
            --color-acento: #ff5722;

            --fuente-principal: 'Segoe UI', sans-serif;
            --espaciado: 1rem;
            --radio: 1rem;
            --sombra: 0 4px 10px rgba(0, 0, 0, 0.1);

            --cover-shape: 50%;
            --boton-flex-direction: row;
        }

        header {
            background-color: var(--color-primary);
            padding: var(--espaciado);
            display: flex;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        button {
            background-color: var(--color-acento);
            border: none;
            color: #ffffff;
            padding: 0.5rem;
            border-radius: var(--radio);
            cursor: pointer;
        }

        .reproductor {
            max-width: 400px;
            margin: 2rem auto;
            background-color: var(--color-card);
            color: var(--color-text);
            padding: var(--espaciado);
            border-radius: var(--radio);
            box-shadow: var(--sombra-verde, var(--sombra, 0 4px 10px rgba(116, 43, 43, 0.541)));
            text-align: center;
        }

        button {
            background-color: var(--color-acento);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radio);
            cursor: pointer;
            margin-left: 0.5rem;
        }

        .controles {
            padding: var(--espaciado);
            display: flex;
            justify-content: center;
            gap: var(--espaciado);
        }

        .modo-oscuro {
            --color-bg: #121212;
            --color-text: #ffffff;
            --color-card: #1e1e1e;
        }

        body.estilo-alt {
            --cover-shape: 0%;
            --boton-flex-direction: column;
        }

        .botones {
            display: flex;
            flex-direction: var(--boton-flex-direction);
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .botones button {
            font-size: 1.5rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>MI REPRODUCTOR</h1>
        <div class="controles">
            <button onclick="document.getElementById('reproductor').classList.toggle('modo-oscuro')"> Modo Oscuro Reproductor</button>
            <button onclick="document.body.classList.toggle('modo-oscuro')"> Modo Oscuro</button>
            <button onclick="document.body.classList.toggle('estilo-alt')">Cambiar Estilo</button>
        </div>
    </header>

    <main class="reproductor" id="reproductor">
        <img src="#" alt="Carátula" />
        <h2>Canción de Ejemplo</h2>
        <p>Artista Desconocido</p>
        <div class="botones">
            <button> << </button>
            <button> |> </button>
            <button> >> </button>
        </div>
    </main>
</body>

</html>
