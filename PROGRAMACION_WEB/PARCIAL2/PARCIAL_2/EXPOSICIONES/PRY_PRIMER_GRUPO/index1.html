<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables CSS</title>
    <style>
        :root{
            --color-fondo: white;
            --color-texto: black;
        }

        body[data-tema="oscuro"]{
            --color-fondo:black;
            --color-texto: white;
        }
        button{
            width:120px;
            border-radius: 50%;
        }
        body{
            background-color: var(--color-fondo);
            color: var(--color-texto)
        }
    </style>
</head>
<body data-tema="claro">

    <h1 class="texto">Fondo</h1>
    <button onclick="cambiarTema()">Cambiar Fondo</button>
    
    <script>
        function cambiarTema(){
            const body = document.body;
            const tema = body.getAttribute("data-tema");
            body.setAttribute("data-tema",tema=="oscuro"?"claro":"oscuro");
        }
    </script>
</body>
</html>
