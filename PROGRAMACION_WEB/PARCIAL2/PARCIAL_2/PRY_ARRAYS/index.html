<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARRAYS EN JS</title>
    <link rel="stylesheet" href="public/lib/bootstrap-5.3.5-dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5 bg bg-info p-4 rounded shadow">
        <h1 class="text-center fw-bold">ARRAYS EN JS</h1>
        <hr>
        <label class="fw-bold form-label" for="notas">INGRESE SUS NOTAS SEPARADAS POR COMAS</label>

        <ul id="lista-notas" class="list-group mt-3"></ul>
        <p id="promedio" class="mt-2 fw-bold"></p>

        <hr>
        <button onclick="agregarNota20()" class="btn btn-primary mt-3">Agregar Nota de 20</button>
    </div>

    <script src="public/js/arrays.js"></script>
    <script src="public/lib/bootstrap-5.3.5-dist/js/bootstrap.min.js"></script>
</body>

</html>
