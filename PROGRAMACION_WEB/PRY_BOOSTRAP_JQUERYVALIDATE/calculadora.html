<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./public/bootstrap-5.3.5-dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container fluid py-3">
        <div class="card">
            <div class="card-header">
                <div class="form-floating mb-3">
                    <input type="number" class="form-control" id="floatingInput" placeholder="name@example.com">
                    <label for="floatingInput"></label>
                  </div>
            </div>
            <table class="table table-striped">
                <tbody>
                    <tr>
                        <td><button class="btn btn-primary w-100" type="button">7</button></td>
                        <td><button class="btn btn-primary w-100" type="button">8</button></td>
                        <td><button class="btn btn-primary w-100" type="button">9</button></td>
                        <td><button class="btn btn-secondary w-100" type="button">/</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn btn-primary w-100" type="button">4</button></td>
                        <td><button class="btn btn-primary w-100" type="button">5</button></td>
                        <td><button class="btn btn-primary w-100" type="button">6</button></td>
                        <td><button class="btn btn-secondary w-100" type="button">*</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn btn-primary w-100" type="button">1</button></td>
                        <td><button class="btn btn-primary w-100" type="button">2</button></td>
                        <td><button class="btn btn-primary w-100" type="button">3</button></td>
                        <td><button class="btn btn-secondary w-100" type="button">-</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn btn-secondary w-100" type="button">.</button></td>
                        <td><button class="btn btn-primary w-100" type="button">0</button></td>
                        <td><button class="btn btn-success w-100" type="button">=</button></td>
                        <td><button class="btn btn-secondary w-100" type="button">+</button></td>
                    </tr>
                </tbody>
            </table>
            <div class="card-body">

            </div>
        </div>
    </div>

    <script src="./public/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
